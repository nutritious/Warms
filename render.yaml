services:
  - type: web
    name: warms-chat
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    # A persistent disk keeps accounts, messages and images across restarts and redeploys.
    # Without it everything resets, so don't remove this.
    disk:
      name: chat-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /data
      # Optional: also email problem reports to the Owner. Reports always appear in the Owner Panel even without this.
      - key: SMTP_HOST
        value: smtp.mail.me.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: REPORT_EMAIL
        value: artem.yegorov@icloud.com
