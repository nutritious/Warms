<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="splash" class="splash" aria-hidden="true">
    <div class="sp-orb o1"></div><div class="sp-orb o2"></div><div class="sp-orb o3"></div>
    <div class="sp-rays"></div>
    <div class="sp-grid"></div>
    <div class="sp-stars"></div>
    <div class="sp-ring r1"></div><div class="sp-ring r2"></div><div class="sp-ring r3"></div>
    <div class="sp-burst" id="spBurst"></div>
    <div class="sp-center">
      <div class="sp-logo">&#9786;</div>
      <div class="sp-welcome">Welcome to</div>
      <div class="sp-title" id="spTitle"></div>
      <div class="sp-feats"><b>&#128172; Chat</b><b>&#127918; Games</b><b>&#129689; Coins</b><b>&#128203; Quests</b><b>&#127873; Packs</b></div>
      <div class="sp-ready">Get ready<span>.</span><span>.</span><span>.</span></div>
      <div class="sp-bar"><i></i></div>
      <div class="sp-pct" id="spPct">0%</div>
      <button id="spEnter" class="sp-enter" type="button">Enter Warms World &#10140;</button>
    </div>
    <div class="sp-flash"></div>
  </div>
  <div id="auth" class="auth hidden">
    <form id="authForm" class="auth-card" autocomplete="on">
      <h1 id="authTitle">Welcome back!</h1>
      <p id="authSub" class="auth-sub">We're so excited to see you again!</p>
      <p id="authNote" class="auth-note hidden"></p>
      <label>USERNAME<input id="authUser" name="username" autocomplete="username" maxlength="24" required></label>
      <label>PASSWORD<input id="authPass" name="password" type="password" autocomplete="current-password" required></label>
      <label id="authInviteWrap" class="hidden">INVITE CODE<input id="authInvite" name="invite" autocomplete="off" maxlength="30" spellcheck="false" placeholder="Ask the Owner for one"></label>
      <div id="authRulesWrap" class="auth-rules-wrap hidden">
        <div id="authRules" class="auth-rules" tabindex="0" aria-label="Server Rules"></div>
        <label class="auth-agree"><input id="authAgree" type="checkbox"> I have read and agree to the Server Rules</label>
      </div>
      <div id="authErr" class="auth-err"></div>
      <button id="authBtn" class="btn primary" type="submit">Log In</button>
      <p class="auth-switch"><span id="authSwitchText">Need an account?</span> <a href="#" id="authSwitch">Register</a></p>
    </form>
  </div>

  <div id="app" class="app hidden">
    <nav class="rail">
      <div class="rail-home" title="Home">&#9786;</div>
      <div id="onlineCount" class="rail-online"></div>
      <button id="railAnn" class="rail-chat rail-ann" type="button" title="Announcements (only the Owner posts)"></button>
      <button id="railDM" class="rail-chat rail-dm" type="button" title="Friends and messages">💬<span id="railDMBadge" class="rail-badge hidden"></span></button>
      <button id="railLog" class="rail-chat rail-log" type="button" title="Update log: what's new">📜<span id="railLogDot" class="rail-badge dot hidden"></span></button>
      <button id="railPolls" class="rail-chat rail-polls" type="button" title="Polls: vote on what the Owner asks">📊<span id="railPollDot" class="rail-badge dot hidden"></span></button>
      <button id="railQuests" class="rail-chat rail-quests" type="button" title="Daily quests: finish them for coins">📋<span id="railQuestDot" class="rail-badge dot hidden"></span></button>
      <button id="railArcade" class="rail-chat rail-arcade" type="button" title="Arcade: games and coin games">🕹️</button>
      <button id="railGames" class="rail-chat rail-games" type="button" title="Web games: play right here">🌐</button>
      <button id="railGame" class="rail-chat rail-game hidden" type="button" title="A minigame is running! Win a prize">🎮</button>
      <div class="rail-sep"></div>
      <div id="railChats" class="rail-chats"></div>
      <button id="railAdd" class="rail-add hidden" type="button" title="New space">＋</button>
    </nav>

    <aside class="side">
      <header class="side-head"><span id="serverName"></span><span class="chev">&#8964;</span></header>
      <div class="side-scroll">
        <div class="cat"><span>TEXT CHANNELS</span><button id="addChannel" class="icon-btn hidden" title="Create channel">+</button></div>
        <div id="channelList"></div>
        <button id="newChat" class="newchat hidden" type="button"><span>＋</span> New chat</button>
        <div id="voiceSection"><div class="cat voice"><span>VOICE CHANNELS</span></div>
        <div id="voiceList" class="voice-list"></div></div>
        <button id="reportBtn" class="reportlink" type="button">Report a problem</button>
        <button id="rulesBtn" class="reportlink" type="button">Server rules</button>
      </div>
      <div id="sideBox" class="sidebox hidden"></div>
      <div id="voiceBar" class="voicebar hidden"></div>
      <footer class="userpanel">
        <div id="meAvatar" class="avatar"></div>
        <div class="me-text"><div id="meName" class="me-name"></div><div id="meRole" class="me-role"></div></div>
        <button id="settingsBtn" class="icon-btn" title="Settings">&#9881;</button>
        <div class="up-actions">
          <button id="coinBtn" class="coin-chip" type="button" title="Coins and rewards"></button>
          <button id="ownerBtn" class="icon-btn owner-btn hidden" title="Owner panel">&#9819;</button>
          <button id="adminPanelBtn" class="icon-btn hidden" title="Admin panel">&#128736;</button>
          <button id="adminBtn" class="icon-btn hidden" title="Command Center">&#9889;</button>
          <button id="commBtn" class="icon-btn hidden" title="Community panel">&#127775;</button>
          <button id="staffBtn" class="icon-btn hidden" title="Staff panel">&#128737;</button>
          <button id="trollBtn" class="icon-btn hidden" title="Troll panel">&#127917;</button>
        </div>
      </footer>
    </aside>

    <main class="main">
      <header class="main-head"><span class="hash">#</span><span id="channelTitle"></span><button id="headDM" class="head-dm" type="button" title="Friends and messages">💬<span id="headDMBadge" class="rail-badge hidden"></span></button><span class="head-quick"><button id="headQuests" class="head-btn" type="button" title="Daily quests">📋<span id="headQuestDot" class="rail-badge dot hidden"></span></button><button id="headGames" class="head-btn" type="button" title="Web games">🌐</button><button id="headPolls" class="head-btn" type="button" title="Polls">📊<span id="headPollDot" class="rail-badge dot hidden"></span></button><button id="headArcade" class="head-btn" type="button" title="Arcade">🕹️</button><button id="headLog" class="head-btn" type="button" title="Update log">📜<span id="headLogDot" class="rail-badge dot hidden"></span></button></span></header>
      <div id="cdBar" class="cdbar hidden"></div>
      <div id="messages" class="messages"></div>
      <div class="composer-wrap">
        <div id="replyBar" class="replybar hidden"></div>
        <div id="pending" class="pending hidden"></div>
        <div class="composer">
          <button id="attachBtn" class="attach" title="Upload an image">&#8613;</button>
          <input id="fileInput" type="file" accept="image/png,image/jpeg,image/gif,image/webp" hidden>
          <input id="msgInput" placeholder="Message" maxlength="2000" autocomplete="off">
        </div>
        <div id="typing" class="typing">&nbsp;</div>
      </div>
    </main>

    <aside id="members" class="members"></aside>
  </div>

  <div id="banner" class="banner hidden" role="status"></div>
  <div id="overlay" class="overlay hidden"></div>
  <div id="popover" class="popover hidden"></div>
  <script src="/app.js"></script>
</body>
</html>
